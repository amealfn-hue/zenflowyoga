        <div class="card">
         <div class="card-header">
            ¿Necesito experiencia previa para empezar?

        </div>
            <div class="card-body">
            <figure>
            <blockquote class="blockquote">
            <p>No necesitas ninguna experiencia previa. Nuestras clases están diseñadas para todos los niveles, desde principiantes hasta practicantes avanzados. Cada instructor adapta las posturas según las necesidades individuales de los estudiantes.
             </p>
            </blockquote>
            </figure>
            </div>
        </div>


                <div class="card">
         <div class="card-header">
            ¿Qué necesito para las clases online?

        </div>
            <div class="card-body">
            <figure>
            <blockquote class="blockquote">
            <p>Para las clases online necesitas una esterilla de yoga, ropa cómoda, una buena conexión a internet y un espacio tranquilo. Opcionalmente, puedes usar bloques, correas y mantas para mayor comodidad. Todos estos accesorios están disponibles en nuestra tienda.
             </p>
            </blockquote>
            </figure>
            </div>
        </div>


         <div class="card">
             <div class="card-header">
                     ¿Cuál es la diferencia entre yoga y mindfulness?


            </div>
            <div class="card-body">
                 <figure>
             <blockquote class="blockquote">
             <p>El yoga combina posturas físicas, respiración y meditación para trabajar cuerpo y mente. Mindfulness se enfoca específicamente en la atención plena y la meditación. Ambas prácticas se complementan perfectamente y las ofrecemos de forma integrada en muchas de nuestras sesiones.</p>
            </blockquote>
             </figure>
